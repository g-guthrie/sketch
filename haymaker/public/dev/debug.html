<!doctype html><meta charset="utf-8"><canvas id="c"></canvas>
<script type="module">
import { renderFighter } from '../js/gfx/sprite.js';
import { FIGHTERS } from '../js/gfx/fighters.js';
const f = structuredClone(FIGHTERS.find(x => x.id === 'duke'));
f.palette.hair = f.palette.glove;
const s = renderFighter(f, {}, 'front', 1.25);
const c = document.getElementById('c'); c.width = s.w * 6; c.height = s.h * 6;
const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(s.canvas, 0, 0, s.w * 6, s.h * 6);
</script>
